<svg width="420" height="195" viewBox="0 0 420 195" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="pdBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#11121d" />
      <stop offset="50%" stop-color="#151728" />
      <stop offset="100%" stop-color="#1a1b2e" />
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="pdBorderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5d4" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#70a5fd" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#7928ca" stop-opacity="0.6" />
    </linearGradient>

    <!-- Area Waveform Gradient -->
    <linearGradient id="pdAreaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#bd93f9" stop-opacity="0.65" />
      <stop offset="50%" stop-color="#7928ca" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#13141f" stop-opacity="0.0" />
    </linearGradient>

    <!-- Scanner Laser Gradient -->
    <linearGradient id="pdLaserGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00f5d4" stop-opacity="0" />
      <stop offset="50%" stop-color="#00f5d4" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#00f5d4" stop-opacity="0" />
    </linearGradient>

    <style>
      @keyframes laserScanSweep {
        0% { transform: translateX(0px); }
        50% { transform: translateX(225px); }
        100% { transform: translateX(0px); }
      }
      @keyframes areaBreathPulse {
        0%, 100% { opacity: 0.85; }
        50% { opacity: 1; filter: drop-shadow(0 0 6px #7928ca); }
      }
      @keyframes nodeGlowPulse {
        0%, 100% { r: 3.5px; opacity: 0.8; filter: drop-shadow(0 0 2px #00f5d4); }
        50% { r: 5px; opacity: 1; filter: drop-shadow(0 0 6px #00f5d4); }
      }
      @keyframes nodeHaloRing {
        0% { r: 4px; opacity: 0.8; stroke-width: 1.5px; }
        100% { r: 12px; opacity: 0; stroke-width: 0.5px; }
      }
      @keyframes liveStatusBlink {
        0%, 100% { fill: #00e676; filter: drop-shadow(0 0 2px #00e676); }
        50% { fill: #00f5d4; filter: drop-shadow(0 0 8px #00f5d4); }
      }

      .laser-scanner {
        animation: laserScanSweep 6s ease-in-out infinite;
      }
      .wave-area {
        animation: areaBreathPulse 3.5s ease-in-out infinite;
      }
      .peak-dot {
        animation: nodeGlowPulse 2s ease-in-out infinite;
      }
      .peak-halo {
        animation: nodeHaloRing 2s cubic-bezier(0.1, 0.4, 0.6, 1) infinite;
      }
      .live-dot {
        animation: liveStatusBlink 1.8s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Card Background -->
  <rect x="0.6" y="0.6" width="418.8" height="193.8" rx="12" fill="url(#pdBgGrad)" stroke="url(#pdBorderGrad)" stroke-width="1.2"/>

  <!-- ================= LEFT COLUMN: USER DETAILS & LIVE METRICS ================= -->
  <g transform="translate(18, 0)">
    <!-- Username Header -->
    <text x="0" y="32" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-weight="800" font-size="14" fill="#70a5fd" letter-spacing="0.5">RIDDHIDEV-OPS</text>
    <circle cx="120" cy="27" r="3.5" class="live-dot"/>

    <!-- Metric 1: Contributions -->
    <g transform="translate(0, 58)">
      <circle cx="6" cy="6" r="6" fill="#1b2836"/>
      <path d="M 6 2 C 3.8 2 2 3.8 2 6 C 2 7.8 3.1 9.3 4.7 9.8 C 4.9 9.8 5 9.7 5 9.6 L 5 8.9 C 3.9 9.1 3.6 8.4 3.6 8.4 C 3.4 8 3.1 7.9 3.1 7.9 C 2.8 7.6 3.1 7.6 3.1 7.6 C 3.4 7.6 3.6 7.9 3.6 7.9 C 3.9 8.5 4.5 8.3 4.7 8.2 C 4.7 7.9 4.8 7.7 5 7.6 C 4.1 7.5 3.1 7.1 3.1 5.5 C 3.1 5 3.3 4.6 3.6 4.3 C 3.5 4.2 3.4 3.7 3.6 3.1 C 3.6 3.1 4 3 5 3.6 C 5.4 3.5 5.8 3.4 6.2 3.4 C 6.6 3.4 7 3.5 7.4 3.6 C 8.4 3 8.8 3.1 8.8 3.1 C 9 3.7 8.9 4.2 8.8 4.3 C 9.1 4.6 9.3 5 9.3 5.5 C 9.3 7.1 8.3 7.5 7.4 7.6 C 7.6 7.7 7.7 8 7.7 8.5 L 7.7 9.6 C 7.7 9.7 7.8 9.8 8 9.8 C 9.6 9.3 10.7 7.8 10.7 6 C 10.7 3.8 8.9 2 6.7 2 Z" fill="#00f5d4"/>
      <text x="18" y="10" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-weight="700" font-size="10.5" fill="#00f5d4">111+ Contributions</text>
    </g>

    <!-- Metric 2: Repos -->
    <g transform="translate(0, 88)">
      <rect x="1" y="1" width="10" height="9" rx="1.5" fill="none" stroke="#70a5fd" stroke-width="1.2"/>
      <line x1="3" y1="4" x2="9" y2="4" stroke="#70a5fd" stroke-width="1"/>
      <text x="18" y="9" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-weight="700" font-size="10.5" fill="#70a5fd">34 Public Repos</text>
    </g>

    <!-- Metric 3: Joined Time -->
    <g transform="translate(0, 118)">
      <circle cx="6" cy="6" r="5" fill="none" stroke="#bd93f9" stroke-width="1.2"/>
      <line x1="6" y1="3" x2="6" y2="6" stroke="#bd93f9" stroke-width="1.2"/>
      <line x1="6" y1="6" x2="8.5" y2="6" stroke="#bd93f9" stroke-width="1.2"/>
      <text x="18" y="9.5" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-weight="600" font-size="10" fill="#c9d1d9">Joined GitHub 1 yr ago</text>
    </g>

    <!-- Metric 4: Merged PRs / Open Source -->
    <g transform="translate(0, 148)">
      <circle cx="6" cy="6" r="5" fill="#ff007f" fill-opacity="0.2" stroke="#ff007f" stroke-width="1"/>
      <circle cx="6" cy="6" r="2.5" fill="#ff79c6"/>
      <text x="18" y="9.5" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-weight="700" font-size="10" fill="#ff79c6">15+ Merged PRs</text>
    </g>

    <!-- Status Subtitle -->
    <text x="0" y="180" font-family="'JetBrains Mono',Consolas,monospace" font-weight="600" font-size="8.5" fill="#00e676">⚡ STATUS: ACTIVE COMMITTER</text>
  </g>

  <!-- Vertical Divider -->
  <line x1="165" y1="20" x2="165" y2="180" stroke="#252a42" stroke-width="1"/>

  <!-- ================= RIGHT COLUMN: 12-MONTH AREA CONTRIBUTION WAVEFORM ================= -->
  <text x="398" y="24" text-anchor="end" font-family="'JetBrains Mono',Consolas,monospace" font-size="8" fill="#7982a9">contributions in the last year</text>

  <!-- Y-Axis Ticks & Grid Lines -->
  <g font-family="'JetBrains Mono',Consolas,monospace" font-size="7.5" fill="#58607a">
    <text x="408" y="58" text-anchor="end">25</text>
    <line x1="175" y1="55" x2="395" y2="55" stroke="#22273c" stroke-width="0.7" stroke-dasharray="2,3"/>

    <text x="408" y="95" text-anchor="end">15</text>
    <line x1="175" y1="92" x2="395" y2="92" stroke="#22273c" stroke-width="0.7" stroke-dasharray="2,3"/>

    <text x="408" y="132" text-anchor="end">5</text>
    <line x1="175" y1="129" x2="395" y2="129" stroke="#22273c" stroke-width="0.7" stroke-dasharray="2,3"/>

    <text x="408" y="162" text-anchor="end">0</text>
    <line x1="175" y1="158" x2="395" y2="158" stroke="#252a42" stroke-width="1"/>
  </g>

  <!-- X-Axis Dates -->
  <g font-family="'JetBrains Mono',Consolas,monospace" font-size="7.5" fill="#7982a9" text-anchor="middle">
    <text x="178" y="172">25/09</text>
    <text x="214" y="172">25/11</text>
    <text x="250" y="172">26/01</text>
    <text x="286" y="172">26/03</text>
    <text x="322" y="172">26/05</text>
    <text x="358" y="172">26/07</text>
    <text x="394" y="172">26/09</text>
  </g>

  <!-- Area Waveform Path (Reflecting Actual Activity Curve) -->
  <!-- 25/09(178,158) -> Peak 25/10(196,65) -> Base 25/11(214,155) -> Flat 26/01(250,158) -> Rise 26/03(286,122) -> Rise 26/05(322,142) -> Peak 26/06(358,102) -> Dip 26/07(370,152) -> Peak 26/09(394,60) -->
  <path d="M 178 158 L 178 158 Q 187 150, 196 65 Q 205 145, 214 155 Q 232 158, 250 158 Q 268 155, 286 122 Q 304 135, 322 142 Q 340 115, 358 102 Q 370 148, 376 152 Q 385 110, 394 60 L 394 158 Z" fill="url(#pdAreaGrad)" class="wave-area"/>

  <!-- Stroke Line on Top -->
  <path d="M 178 158 Q 187 150, 196 65 Q 205 145, 214 155 Q 232 158, 250 158 Q 268 155, 286 122 Q 304 135, 322 142 Q 340 115, 358 102 Q 370 148, 376 152 Q 385 110, 394 60" fill="none" stroke="#bd93f9" stroke-width="2" style="filter: drop-shadow(0 0 3px #7928ca);"/>

  <!-- Pulsing Milestone Peak Nodes -->
  <!-- Node 1: Oct/Nov Peak -->
  <circle cx="196" cy="65" r="3.5" stroke="#00f5d4" fill="none" class="peak-halo"/>
  <circle cx="196" cy="65" r="3.5" fill="#00f5d4" class="peak-dot"/>

  <!-- Node 2: March Rise -->
  <circle cx="286" cy="122" r="3" stroke="#70a5fd" fill="none" class="peak-halo" style="animation-delay: 0.7s;"/>
  <circle cx="286" cy="122" r="3" fill="#70a5fd" class="peak-dot" style="animation-delay: 0.7s;"/>

  <!-- Node 3: June Peak -->
  <circle cx="358" cy="102" r="3" stroke="#ff79c6" fill="none" class="peak-halo" style="animation-delay: 1.4s;"/>
  <circle cx="358" cy="102" r="3" fill="#ff79c6" class="peak-dot" style="animation-delay: 1.4s;"/>

  <!-- Node 4: September Surge -->
  <circle cx="394" cy="60" r="3.5" stroke="#00f5d4" fill="none" class="peak-halo" style="animation-delay: 1.9s;"/>
  <circle cx="394" cy="60" r="3.5" fill="#00f5d4" class="peak-dot" style="animation-delay: 1.9s;"/>

  <!-- Laser Playhead Scanner (Sweeps across timeline) -->
  <g class="laser-scanner" transform="translate(175, 0)">
    <line x1="0" y1="48" x2="0" y2="158" stroke="url(#pdLaserGrad)" stroke-width="2"/>
    <circle cx="0" cy="102" r="2.5" fill="#ffffff" style="filter: drop-shadow(0 0 3px #00f5d4);"/>
  </g>
</svg>